seed: 20260915

paths:
  data: data            # local, git-ignored
  manifests: manifests  # committed
  prompts: prompts      # committed

unpc:
  opus_base: https://object.pouta.csc.fi/OPUS-UNPC/v1.0
  alignment_file: data/unpc/ar-en.xml.gz
  alignment_sha256: aca39806004e2127047af654d393e31108182ab3130e76fb96e47876ed2ccb52
  selection_salt: rageval-unpc-v1
  # Of 114,047 en-ar document pairs, 35,979 pass these rules (docs/corpus.md).
  eligibility:
    min_one_to_one_links: 30    # below this, mostly cover pages and short notes
    max_one_to_one_links: 400   # above this (~p90), one report would dominate the chunk pool
    min_one_to_one_ratio: 0.85  # share of links that pair exactly one sentence with one sentence
  # Cut from 1,500 + 500 (53,587 chunks) before any questions were built: embedding the corpus
  # twice on a free Colab T4 per model was hours of iteration time for no gain in the result.
  n_seed_docs: 1000
  max_cited_docs: 250

chunking:
  tokenizer: intfloat/multilingual-e5-base  # identical vocabulary to BAAI/bge-m3 (checked)
  passage_prefix: "passage: "
  model_max_tokens: 512
  target_tokens: 200
  max_tokens: 350

questions:
  n_single: 100
  n_numeric: 40               # oversampled so corrected-vs-uncorrected has a confidence interval
  n_comparison: 50            # stop multi-hop if the 20-candidate test accepts fewer than 5
  n_bridge: 50                # citation bridges: documented negative result, not in "all"
  max_candidates_single: 250
  max_candidates_numeric: 120
  max_candidates_comparison: 300
  max_candidates_bridge: 300
  comparison_max_keyword_docs: 20
  # No answer_f1_threshold: token F1 >= 0.5 accepted a wrong answer in the pilot and is now only
  # recorded. Answers are gated by the verifier's same-fact judgement (prompts/judge_equivalence.txt).
  dedup_jaccard: 0.8
  shingle_size: 5
  content_filter:
    min_chars: 300
    min_letter_ratio: 0.6
    max_toc_line_ratio: 0.3
    min_paragraph_words: 25
    min_one_to_one_ratio: 0.8
  generator:
    base_url: https://api.groq.com/openai/v1
    api_key_env: GROQ_API_KEY
    model: openai/gpt-oss-120b
    params:
      temperature: 0
      seed: 20260915
      reasoning_effort: low       # gpt-oss accepts low | medium | high; reasoning tokens still count
      include_reasoning: false    # keep reasoning out of `content` so the JSON parses
      max_completion_tokens: 2048
      response_format: {type: json_object}
  verifier:  # also judges answer equivalence and comparison choices
    base_url: https://api.groq.com/openai/v1
    api_key_env: GROQ_API_KEY
    # qwen/qwen3.6-27b (a Groq preview model) was withdrawn on 2026-09-15 with no deprecation notice.
    # Every single-hop and numeric candidate was re-verified with this model (scripts/reverify.py).
    model: qwen/qwen3.8-27b
    params:
      temperature: 0
      seed: 20260915
      reasoning_effort: none      # qwen3.8-27b accepts none | default | low | medium | high
      reasoning_format: hidden    # Groq: JSON mode requires parsed or hidden, not raw
      max_completion_tokens: 512
      response_format: {type: json_object}

generation:
  k: 5   # passages given to the answering model; Recall@5 is the retrieval ceiling for generation
  # answerer and judge are deliberately unset: choosing them is a pending decision (free or local
  # answerer; stronger paid judge within the $20 cap, cost quoted before any paid run).
  # answerer: {base_url: ..., api_key_env: ..., model: ..., params: {...}}
  # judge:    {base_url: ..., api_key_env: ..., model: ..., params: {...}}

audit:
  n: 100
  # Accepted smoke-run questions the context filter missed. They stay in the audit on purpose, so the
  # audit measures how many such misses remain rather than assuming. Keyed by gold chunk id, because
  # question ids are renumbered on every rebuild.
  flag_chunks:
    "2003/a/c_6/58/sr_1#0002": "smoke #5: 'according to the mentioned decision' (filter extended afterwards)"
    "2006/e/c_19/2006/6/add_14#0014": "smoke #10: 'the meeting' without saying which (not caught by the filter)"
